spring.application.name=ai-vo-mapping-assistant
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB
springdoc.swagger-ui.path=/swagger-ui.html
spring.ai.openai.api-key=${OPENAI_API_KEY:}
mapping.ai.enabled=${MAPPING_AI_ENABLED:true}
mapping.ai.model=${OPENAI_MODEL:gpt-4o-mini}
mapping.ai.minimum-score=40
mapping.ai.timeout=20s
